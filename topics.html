<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse Simulations by Topic - STEM Simulation Hub</title><style>
:root{--p:#0f6e63;--p-dark:#0b544c;--s:#14b8a6;--s-light:#e4f7f4;--bg:#eef8f6;--card:#fff;--ink:#0f1b19;--muted:#5b6b68;--line:#d7ebe7;--line-soft:#eaf6f4;--gold:#f5a623;--gold-deep:#c9820a;--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--shadow-sm:0 1px 2px rgba(15,27,25,.06),0 1px 1px rgba(15,27,25,.04);--shadow-md:0 10px 24px -8px rgba(15,27,25,.16),0 2px 8px rgba(15,27,25,.06);--shadow-lg:0 24px 48px -14px rgba(15,27,25,.28),0 4px 14px rgba(15,27,25,.08);--focus:0 0 0 3px rgba(20,184,166,.35)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,"Segoe UI","Segoe UI Variable",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1100px 480px at 105% -12%,#d9f3ee 0%,transparent 60%),radial-gradient(900px 420px at -10% 0%,#eaf9f6 0%,transparent 55%),var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
header{background:linear-gradient(120deg,var(--p) 0%,var(--s) 72%,#5eead4 100%);color:#fff;padding:18px 20px 20px;position:sticky;top:0;z-index:10;box-shadow:0 8px 24px -12px rgba(11,84,76,.5)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;max-width:1500px;margin:0 auto}
.top h1{flex:1 1 100%;font-size:1.45rem;font-weight:800;letter-spacing:-.01em;margin:0}
.top p.tagline{flex:1 1 100%;margin:4px 0 0;font-size:.92rem;color:#e6fffb;font-weight:500}
.top-links{display:flex;flex-wrap:wrap;gap:8px}
.top-links a,.top-links button{color:#fff;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);border-radius:var(--radius-sm);padding:9px 14px;text-decoration:none;font-weight:700;font-size:.92rem;cursor:pointer;transition:background .15s ease,box-shadow .15s ease,transform .1s ease}
.top-links a:hover,.top-links button:hover{background:rgba(255,255,255,.26);box-shadow:var(--shadow-sm)}
.top-links a:active,.top-links button:active{transform:translateY(1px)}
.top-links a:focus-visible,.top-links button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr)) minmax(200px,1.3fr);gap:10px;margin-top:16px;max-width:1500px;margin-left:auto;margin-right:auto}
.filters select,.filters input{font:inherit;padding:11px 12px;border:1px solid transparent;border-radius:var(--radius-sm);min-width:0;background:rgba(255,255,255,.96);color:var(--ink);box-shadow:var(--shadow-sm);transition:box-shadow .15s ease}
.filters select:hover,.filters input:hover{box-shadow:var(--shadow-md)}
.filters select:focus-visible,.filters input:focus-visible{outline:none;border-color:var(--s);box-shadow:var(--focus)}
.filters input::placeholder{color:#7c9490}
main{max-width:1500px;margin:auto;padding:20px}
.jumpnav{display:flex;flex-wrap:wrap;gap:8px;padding:16px 20px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid var(--line-soft);margin-bottom:20px}
.jumpnav a{color:var(--p);background:var(--s-light);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;text-decoration:none;transition:background .15s ease}
.jumpnav a:hover{background:var(--p);color:#fff}
.subject-section{margin-bottom:28px}
.subject-heading{font-size:1.5rem;font-weight:800;letter-spacing:-.01em;color:var(--p-dark);margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.category-block{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid var(--line-soft);margin-bottom:16px;overflow:hidden;scroll-margin-top:110px}
.category-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;background:linear-gradient(180deg,#fbfffe,#f5fdfb);border-bottom:1px solid var(--line)}
.category-head h3{margin:0;color:var(--p);font-size:1.08rem;font-weight:800;letter-spacing:-.01em}
.badge{background:var(--s-light);color:var(--p);padding:6px 11px;border-radius:999px;font-weight:800;font-size:.82rem}
.resources{display:grid;gap:14px;padding:18px 20px}
.resource{display:flex;gap:16px;border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;text-decoration:none;color:inherit;background:#fff;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.resource:hover{transform:translateY(-3px);border-color:var(--s);box-shadow:var(--shadow-lg)}
.resource:focus-visible{outline:none;box-shadow:var(--focus),var(--shadow-lg)}
.resource strong{color:var(--p);font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.resource-body{flex:1;min-width:0}
.thumb-wrap{flex:0 0 168px;aspect-ratio:16/10;background:linear-gradient(135deg,#d3f0ea,#eaf9f6);border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line-soft);box-shadow:var(--shadow-sm)}
.thumb{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.resource:hover .thumb{transform:scale(1.06)}
.meta{color:var(--muted);font-size:.87rem;margin-top:4px;font-weight:500}
.stars{color:var(--gold);margin-top:9px;font-size:.95rem;letter-spacing:1px}
.open{color:var(--s);font-weight:800;margin-top:10px;font-size:.92rem}
.tag-group{margin-top:11px}
.tag-label{display:block;color:var(--muted);font-size:.72rem;font-weight:800;margin-bottom:6px;text-transform:uppercase;letter-spacing:.07em}
.keywords{display:flex;flex-wrap:wrap;gap:6px}
.keyword{border:1px solid #a9ded4;background:var(--s-light);color:var(--p);padding:5px 10px;border-radius:999px;font-size:.75rem;font-weight:600;cursor:pointer;transition:background .15s ease,color .15s ease,transform .1s ease}
.keyword:hover{background:var(--p);color:#fff}
.keyword:active{transform:scale(.96)}
.keyword:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.empty{color:var(--muted);font-style:italic;padding:18px 20px}
.skip-link{position:absolute;left:-999px;top:auto;width:1px;height:1px;overflow:hidden;background:#fff;color:#111;padding:10px 14px;border-radius:var(--radius-sm);z-index:200;box-shadow:var(--shadow-md)}
.skip-link:focus{left:12px;top:12px;width:auto;height:auto;overflow:visible}
.backtop{text-align:center;padding:4px 0 22px}
.backtop button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;color:var(--p);font-weight:700;box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,transform .15s ease}
.backtop button:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
@media(max-width:820px){.filters{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.filters{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.resource{flex-direction:column}.thumb-wrap{flex-basis:auto;width:100%}}
</style></head><body>
<a class="skip-link" href="#main">Skip to simulations</a>
<header><div class="top"><h1>Browse Simulations by Topic</h1><p class="tagline">Every simulation in the hub, grouped by subject and field — independent of any specific curriculum descriptor.</p><nav class="top-links" aria-label="Site"><a href="index.html">Years 7–10 hub</a><a href="senior.html">Senior syllabus</a><a href="contact.html">Contact</a></nav></div><div class="filters"><select id="subject" aria-label="Filter by subject"><option value="">All subjects</option><option value="Mathematics">Mathematics</option><option value="Science">Science</option></select><select id="category" aria-label="Filter by topic category"><option value="">All fields</option></select><select id="wsLevel" aria-label="Filter by worksheet year level"><option value="">All worksheet levels</option><option value="7">Year 7</option><option value="8">Year 8</option><option value="9">Year 9</option><option value="10">Year 10</option><option value="11-12">Senior (Years 11–12)</option></select><input id="search" type="search" aria-label="Search simulations" placeholder="Search by name, provider or keyword"></div></header>
<main id="main"><nav id="jumpnav" class="jumpnav" aria-label="Jump to a field"></nav><div id="sections"></div><div class="backtop"><button id="backtop" type="button">↑ Back to top</button></div></main>
<script src="resources-junior.js"></script>
<script src="resources-senior.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const CATEGORY_SUBJECT={
 'Algebra & Functions':'Mathematics','Geometry & Measurement':'Mathematics','Number, Ratios & Financial Maths':'Mathematics',
 'Statistics & Probability':'Mathematics','Calculators & Graphing Tools':'Mathematics',
 'Physics':'Science','Chemistry':'Science','Biology':'Science','Earth & Space Science':'Science','Psychology':'Science'
};
const CATEGORY_ORDER=['Algebra & Functions','Geometry & Measurement','Number, Ratios & Financial Maths','Statistics & Probability','Calculators & Graphing Tools','Physics','Chemistry','Biology','Earth & Space Science','Psychology'];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function thumbUrl(r){return 'https://s.wordpress.com/mshots/v1/'+encodeURIComponent(r.url)+'?w=400&h=240'}
function placeholderThumb(name){const h=[...name].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,0)%360,ini=name.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240"><rect width="400" height="240" fill="hsl('+h+',55%,38%)"/><text x="200" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="70" fill="#ffffff" text-anchor="middle" font-weight="700">'+ini+'</text></svg>')}
function loadCustom(key){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}
const ROOT_URL_ALLOWLIST=['www.solarsystemscope.com','solarsystemscope.com'];
function isDirectSimulation(r){try{const u=new URL(r.url),p=u.pathname.replace(/\/$/,'');const blocked=['','/en/simulations','/simulations','/classroom-resources','/welcome-to-simbucket','/vlabs','/eyes','/osp/index.cfm'];return !blocked.includes(p)||!!u.search||ROOT_URL_ALLOWLIST.includes(u.hostname)}catch{return false}}
function buildCatalogue(){
  const sources=[
    ...(typeof RESOURCES_JUNIOR!=='undefined'?RESOURCES_JUNIOR:[]),
    ...(typeof RESOURCES_SENIOR!=='undefined'?RESOURCES_SENIOR:[]),
    ...loadCustom('stemhub_custom_resources_index'),
    ...loadCustom('stemhub_custom_resources_senior')
  ];
  const byUrl=new Map();
  sources.filter(isDirectSimulation).forEach(r=>{
    const key=r.url.trim().toLowerCase();
    const existing=byUrl.get(key);
    if(!existing){byUrl.set(key,{...r,category:r.category||'Uncategorized'})}
    else if(!existing.category||existing.category==='Uncategorized'){existing.category=r.category||existing.category}
  });
  return [...byUrl.values()];
}
const catalogue=buildCatalogue();
function matchesSearch(r,q){if(!q)return true;const hay=[r.name,r.provider,...(r.keywords||[])].join(' ').toLowerCase();return hay.includes(q)}
function fillCategorySelect(){
  const subj=$('subject').value,sel=$('category'),old=sel.value;
  const cats=CATEGORY_ORDER.filter(c=>!subj||CATEGORY_SUBJECT[c]===subj);
  sel.innerHTML='<option value="">All fields</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
  if(cats.includes(old))sel.value=old
}
function makeCard(r){
  const a=document.createElement('a');a.className='resource';a.href='simulation.html?url='+encodeURIComponent(r.url);
  const levels=(r.worksheetYears||[]).map(y=>LEVEL_LABEL[y]||y).join(' · ');
  a.innerHTML='<div class="thumb-wrap"><img class="thumb" src="'+thumbUrl(r)+'" alt="Preview of '+esc(r.name)+'" loading="lazy" width="400" height="240"></div><div class="resource-body"><strong>'+esc(r.name)+'</strong><div class="meta">'+esc(r.provider||'')+'</div><div class="stars">'+'★'.repeat(r.score||0)+'☆'.repeat(5-(r.score||0))+'</div>'+(levels?'<div class="meta">Worksheet: '+esc(levels)+'</div>':'')+'<div class="tag-group"><span class="tag-label">Keywords</span><div class="keywords">'+(r.keywords||[]).map(k=>'<button type="button" class="keyword" data-k="'+esc(k)+'">'+esc(k)+'</button>').join('')+'</div></div><div class="open">Open resource ↗</div></div>';
  const img=a.querySelector('.thumb');img.addEventListener('error',()=>{img.src=placeholderThumb(r.name)},{once:true});
  a.querySelectorAll('.keyword').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();$('search').value=b.dataset.k;render()});
  return a
}
const LEVEL_LABEL={'7':'Year 7','8':'Year 8','9':'Year 9','10':'Year 10','11-12':'Senior 11–12'};
function render(){
  const subj=$('subject').value,cat=$('category').value,lvl=$('wsLevel').value,q=$('search').value.trim().toLowerCase();
  const filtered=catalogue.filter(r=>(!subj||CATEGORY_SUBJECT[r.category]===subj||(!CATEGORY_SUBJECT[r.category]&&subj===''))&&(!cat||r.category===cat)&&(!lvl||(r.worksheetYears||[]).includes(lvl))&&matchesSearch(r,q));
  const bySubject={Mathematics:{},Science:{}};
  const other=[];
  filtered.forEach(r=>{
    const s=CATEGORY_SUBJECT[r.category];
    if(s){(bySubject[s][r.category]=bySubject[s][r.category]||[]).push(r)}
    else other.push(r)
  });
  const sections=$('sections'),jump=$('jumpnav');
  sections.innerHTML='';jump.innerHTML='';
  let total=0;
  ['Mathematics','Science'].forEach(subject=>{
    const cats=CATEGORY_ORDER.filter(c=>CATEGORY_SUBJECT[c]===subject&&bySubject[subject][c]&&bySubject[subject][c].length);
    if(!cats.length)return;
    const section=document.createElement('section');section.className='subject-section';
    section.innerHTML='<h2 class="subject-heading">'+subject+'</h2>';
    cats.forEach(c=>{
      const items=bySubject[subject][c].sort((a,b)=>(b.score||0)-(a.score||0)||a.name.localeCompare(b.name));
      total+=items.length;
      const id='cat-'+c.replace(/[^a-z0-9]+/gi,'-').toLowerCase();
      const block=document.createElement('div');block.className='category-block';block.id=id;
      block.innerHTML='<div class="category-head"><h3>'+esc(c)+'</h3><span class="badge">'+items.length+' simulation'+(items.length===1?'':'s')+'</span></div><div class="resources"></div>';
      const box=block.querySelector('.resources');
      items.forEach(r=>box.appendChild(makeCard(r)));
      section.appendChild(block);
      const j=document.createElement('a');j.href='#'+id;j.textContent=c+' ('+items.length+')';jump.appendChild(j);
    });
    sections.appendChild(section)
  });
  if(other.length){
    const section=document.createElement('section');section.className='subject-section';
    section.innerHTML='<h2 class="subject-heading">Other</h2>';
    const block=document.createElement('div');block.className='category-block';block.id='cat-other';
    block.innerHTML='<div class="category-head"><h3>Uncategorised</h3><span class="badge">'+other.length+' simulation'+(other.length===1?'':'s')+'</span></div><div class="resources"></div>';
    const box=block.querySelector('.resources');
    other.forEach(r=>box.appendChild(makeCard(r)));
    section.appendChild(block);sections.appendChild(section);
    total+=other.length;
    const j=document.createElement('a');j.href='#cat-other';j.textContent='Other ('+other.length+')';jump.appendChild(j);
  }
  if(!total)sections.innerHTML='<p class="empty">No simulations match the current filters.</p>';
}
$('subject').onchange=()=>{fillCategorySelect();render()};
$('category').onchange=render;
$('wsLevel').onchange=render;
$('search').oninput=render;
$('backtop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
(function applyInitParams(){
  const p=new URLSearchParams(location.search);
  const initSubject=p.get('subject');if(initSubject)$('subject').value=initSubject;
  fillCategorySelect();
  const initCat=p.get('category');if(initCat)$('category').value=initCat;
  const initLevel=p.get('wsLevel');if(initLevel)$('wsLevel').value=initLevel;
  const initSearch=p.get('search');if(initSearch)$('search').value=initSearch;
})();
render();
</script>
<footer style="max-width:1500px;margin:32px auto 0;padding:0 20px;color:#5b6b68;font-size:.88rem;text-align:center;">Contact <a href="contact.html">here</a>. All resources are AI-assisted and should be taken with a grain of salt.</footer>
</body></html>
